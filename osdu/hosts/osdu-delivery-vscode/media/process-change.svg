<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530" font-family="'Segoe UI', 'Inter', system-ui, sans-serif">
  <!--
    What a change costs, with and without OSDU Delivery: the first picture of the extension's Marketplace page.
    This file is the source. The README shows process-change.png, rendered from it at twice its size, because the
    Marketplace refuses an SVG picture in a README.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2dd4bf"/>
    </marker>
    <g id="i-code" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4 1 8l4 4M11 4l4 4-4 4"/></g>
    <g id="i-test" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.5h4M7 1.5v5L2.5 14.5h11L9 6.5v-5M4.6 11h6.8"/></g>
    <g id="i-build" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5l6 3v7l-6 3-6-3v-7zM2 4.5l6 3 6-3M8 7.5v7"/></g>
    <g id="i-deploy" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 10v3.5h12V10"/></g>
    <g id="i-send" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 1.5 1.5 7l5 2.5 2.5 5zM6.5 9.5l8-8"/></g>
    <g id="i-check" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4 3 5.5l3-3M1.5 11.5 3 13l3-3M9 4h5.5M9 11.5h5.5"/></g>
    <g id="i-edit" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2l3 3-8.5 8.5H2.5v-3zM9.5 3.5l3 3"/></g>
    <g id="i-eye" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2.2"/></g>
    <g id="i-dry" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.2"/><path d="m11 11 3.5 3.5M4.8 7l1.5 1.5L9 5.8"/></g>
    <g id="i-again" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 6.5A5.8 5.8 0 0 0 3 4.6M2.5 1.5v3.5H6M2.5 9.5A5.8 5.8 0 0 0 13 11.4M13.5 14.5V11H10"/></g>
    <g id="i-file" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5H4A1.5 1.5 0 0 0 2.5 3v10A1.5 1.5 0 0 0 4 14.5h8a1.5 1.5 0 0 0 1.5-1.5V5.5zM9.5 1.5v4h4M6.5 8 5 9.5 6.5 11M9.5 8 11 9.5 9.5 11"/></g>
  </defs>

  <rect width="920" height="530" rx="18" fill="#13171d"/>

  <text x="40" y="50" font-size="12" font-weight="600" letter-spacing="1.6" fill="#5eead4">WHAT A CHANGE COSTS</text>
  <text x="40" y="88" font-size="28" font-weight="600" fill="#e6edf3">Even a small change needs a development cycle</text>

  <!-- Without: every change is a development task. -->
  <circle cx="62" cy="140" r="22" fill="#232a33"/>
  <use href="#i-code" transform="translate(50 128) scale(1.5)" stroke="#c9d1d9" stroke-width="1.3"/>
  <text x="96" y="147" font-size="20" fill="#e6edf3">Changing code</text>
  <text x="40" y="188" font-size="13.5" fill="#8b949e">every change is a development task</text>

  <g font-size="15" fill="#c9d1d9">
    <rect x="40" y="204" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-code" transform="translate(58 215)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="228">Code</text>
    <path d="M206 247l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="256" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-test" transform="translate(58 267)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="280">Test</text>
    <path d="M206 299l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="308" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-build" transform="translate(58 319)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="332">Build</text>
    <path d="M206 351l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="360" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-deploy" transform="translate(58 371)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="384">Deploy</text>
    <path d="M206 403l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="412" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-send" transform="translate(58 423)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="436">Send to OSDU</text>
    <path d="M206 455l4 4 4-4" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="40" y="464" width="340" height="38" rx="8" fill="#1f252d" stroke="#2b333d"/>
    <use href="#i-check" transform="translate(58 475)" stroke="#8b949e" stroke-width="1.6"/>
    <text x="92" y="488">Validate</text>
  </g>

  <!-- With OSDU Delivery: a change is an edit, seen before it is sent. -->
  <rect x="410" y="118" width="470" height="384" rx="16" fill="#0f2826" stroke="#1d4b47"/>
  <text x="436" y="150" font-size="15" font-weight="600" fill="#5eead4">With OSDU Delivery</text>
  <circle cx="454" cy="186" r="18" fill="#14b8a6"/>
  <use href="#i-file" transform="translate(443 175) scale(1.375)" stroke="#042f2e" stroke-width="1.3"/>
  <text x="482" y="192" font-size="17" fill="#e6edf3">Describe the data flow rather than coding it</text>

  <g font-size="14" fill="#e6edf3">
    <rect x="436" y="226" width="190" height="46" rx="10" fill="#12302d" stroke="#2dd4bf" stroke-width="1.4"/>
    <use href="#i-edit" transform="translate(452 241)" stroke="#5eead4" stroke-width="1.6"/>
    <text x="478" y="254">Change configuration</text>

    <rect x="664" y="226" width="190" height="46" rx="10" fill="#12302d" stroke="#2dd4bf" stroke-width="1.4"/>
    <use href="#i-eye" transform="translate(680 241)" stroke="#5eead4" stroke-width="1.6"/>
    <text x="706" y="254">See the record</text>

    <rect x="664" y="322" width="190" height="46" rx="10" fill="#12302d" stroke="#2dd4bf" stroke-width="1.4"/>
    <use href="#i-dry" transform="translate(680 337)" stroke="#5eead4" stroke-width="1.6"/>
    <text x="706" y="350">Dry run</text>

    <rect x="436" y="322" width="190" height="46" rx="10" fill="#12302d" stroke="#2dd4bf" stroke-width="1.4"/>
    <use href="#i-send" transform="translate(452 337)" stroke="#5eead4" stroke-width="1.6"/>
    <text x="478" y="350">Send</text>
  </g>

  <path d="M629 249h30" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M759 275v42" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M661 345h-30" stroke="#2dd4bf" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="586" y="282" width="118" height="30" rx="15" fill="#3b2316" stroke="#f0883e" stroke-width="1.2"/>
  <text x="645" y="302" font-size="14" fill="#ffb77c" text-anchor="middle">Record A-1</text>

  <rect x="436" y="390" width="418" height="36" rx="18" fill="#123733"/>
  <use href="#i-again" transform="translate(452 400)" stroke="#5eead4" stroke-width="1.6"/>
  <text x="478" y="413" font-size="13" fill="#99f6e4">Source, cache and mapping changes trigger a re-delivery</text>

  <rect x="436" y="440" width="418" height="42" rx="21" fill="#2dd4bf"/>
  <text x="645" y="467" font-size="16" font-weight="600" fill="#042f2e" text-anchor="middle">No new build. No new deployment.</text>
</svg>

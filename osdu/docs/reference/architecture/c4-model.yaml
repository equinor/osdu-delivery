      - {n: 7, from: cp_sync, to: catalog, label: "Validates every document; writes the catalog, osdu read models, lineage", tech: SQL, width: 180, explain: "Every document is validated; the catalog's rows, the module's mappings, cache definitions and interfaces, and the lineage are written in the catalog's transaction."}
      - {n: 8, from: cp_sync, to: cp_sched, label: Fires the trigger's schedules, width: 100, explain: "Once the sync has committed, the schedules the trigger names fire."}

      - {n: 6, from: cp_aictx, to: catalog, label: "Checks every column against approved AI contexts", tech: SQL, width: 160, explain: "ColumnPolicyGuard refuses a column no approved context opens, and only one read-only SELECT is planned; the plan token is single-use and lives 15 minutes."}
      - {n: 7, from: cp_aictx, to: node, label: "On the person's Run, queues the query", tech: Compute task, width: 130, explain: "The GUI shows the query; the person's click on Run redeems the plan token (run_query). A saved answer a person confirmed may run without a click: 50 rows, 5 seconds."}
      - {n: 8, from: node, to: data, label: "Runs the SELECT: 200 rows, at most 5,000", tech: SQL, width: 150, explain: "A node runs the SELECT against the ingestion database and returns the rows to the control plane."}
      - {n: 9, from: cp_assist, to: gui, label: "Streams the answer, marked AI-generated", tech: JSON/HTTPS, width: 130, shift: 45, t: 0.3, explain: "The answer streams back marked with the model that wrote it; the conversation is kept in the catalog, and only the person's Yes, Not quite or No records a verdict."}
    notes: |
      An editor's assistant takes the same path from step 4 on, with the person's own token instead of a delegated one, so
      it can do what the person can do. Without `!` the conversation is in estate mode, and the model is sent metadata only:
      the ledger's bookkeeping and the module's definitions, never a record's content or a source row.


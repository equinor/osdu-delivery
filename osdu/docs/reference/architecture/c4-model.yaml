      - {n: 2, from: cp, to: node, label: "Hands out the runs, pinned to the synced commit", tech: Node protocol, width: 160, explain: "A schedule fires (or a person triggers) the pipeline; the control plane queues its runs in lineage order, each pinned to the commit last synced, and a node takes the file flow's run."}

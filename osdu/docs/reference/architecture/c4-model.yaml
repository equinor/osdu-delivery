# The C4 model of OSDU Delivery: every element once, and the views that place them.
#
# Render the diagrams (dark, and light as <view>-light.svg), the pages beside this file and the two decks with:
#   python tools/c4/render.py osdu/docs/reference/architecture/c4-model.yaml
# Each view places its elements by their centre on a 1600 x 900 canvas: [x, y] or [x, y, width, height]. Relationships
# route orthogonally between the boxes they join, or along the sides and waypoints they name (tools/c4/README.md).

product: OSDU Delivery
svgDir: svg
deck:
  file: osdu-delivery-c4.pptx
  kicker: ARCHITECTURE IN THE C4 MODEL
  title: OSDU Delivery
  subtitle: "How it is built and run: the people and systems around it, its containers and their components, the paths a record, a question and a commit take, and its deployment on Azure."
  note: "Every slide is drawn from one model, osdu/docs/reference/architecture/c4-model.yaml, as are the diagrams in the repository. Click an element marked 'view inside' to zoom in; every slide links back to the map of views."
footer: "OSDU Delivery, powered by SQLFlow"
pages:
  frontmatter: true
  dir: .
  index: README.md
indexTitle: "OSDU Delivery in the C4 model"
indexShort: Architecture diagrams
indexDescription: "Each view answers one question, from the product's place among people and systems down to the components inside each container, how a record, a question and a commit move, and how it is deployed."
indexPage:
  title: "Architecture diagrams: OSDU Delivery in the C4 model"
  intro: |
    OSDU Delivery drawn in the [C4 model](https://c4model.com): who uses it and what it relies on, the containers it runs
    as, the components inside the three that hold its logic, how a record, a question and a commit move through them,
    and what the Terraform in `osdu/deploy/terraform` creates on Azure. Start with the system context and read down the
    list. On every page, the line on top leads to the start, the views it zooms out of and the views it zooms into; the
    line at its foot leads to the view before and after it here.

    Every diagram follows the [C4 notation checklist](https://c4model.com/diagrams/checklist): a title naming its type
    and scope, every element with its name, its type and technology and what it does, every line with what it does and
    how, and a key to every colour, shape, icon, border and line style it uses. The diagrams are dark; each page links
    its light version, and the deck comes in both. How the module meets SQLFlow underneath is
    [the architecture page](../concepts/architecture.md).
  seeAlso:
    - {title: "Architecture: the OSDU module on SQLFlow", path: osdu/docs/reference/concepts/architecture.md}
    - {title: "AI in OSDU Delivery", path: osdu/docs/reference/concepts/ai-features.md}
    - {title: Deploying OSDU Delivery, path: osdu/docs/reference/guides/deployment.md}
columns: [Context, Containers, Components, Dynamic, Deployment]

elements:
  # ------------------------------------------------------------------------------------------------- people ---
  developer:
    kind: person
    name: Pipeline developer
    description: Writes the estate's flows, mappings and templates, previews what they render, and pushes them.
    brief: Builds the pipelines.
    detail: Writes the estate's flows, mappings, templates, schedules, assertions and AI contexts in VS Code, checks and previews them against the synced estate, and pushes them to the estate repository.
    ref: osdu/docs/reference/guides/vscode.md
  operator:
    kind: person
    name: Data operator
    description: Runs and watches deliveries, follows a record from its source row to OSDU, and acts on it.
    brief: Operates the deliveries.
    detail: Triggers and watches runs, follows a record from its source file and row to the OSDU id and version it landed as, releases, redelivers or removes records, reads assertion reports and asks the assistant.
    ref: osdu/docs/reference/concepts/gui.md
  admin:
    kind: person
    name: Administrator
    description: Registers OSDU partitions, sets the central configuration and approves AI contexts.
    brief: Configures the estate.
    detail: Registers and describes OSDU partitions, sets the central configuration every run resolves with, approves AI contexts, manages users and sets retention on the Maintenance page.
    ref: osdu/docs/reference/concepts/authentication-and-identity.md

  # ------------------------------------------------------------------------------------------- the product ---
  osdu_delivery:
    kind: system
    name: OSDU Delivery
    icon: lucide:send
    description: Publishes subsurface records into an OSDU platform and keeps a ledger that traces each one to its source row, its rendering and every attempt.
    detail: "SQLFlow with the OSDU module installed: SQLFlow lands and keys the source data; the module renders each row through its mapping, delivers it to OSDU and keeps the ledger, from which every delivered record can be reconstructed."
    ref: osdu/docs/reference/concepts/overview.md
    zoom: containers

  # ------------------------------------------------------------------------------------------ external systems ---
  sources:
    kind: external
    name: Source systems
    icon: lucide:files
    description: Upstream applications and jobs that drop subsurface data as files, or hold it in databases.
    brief: Drop source data as files.
    detail: Where the data starts. Upstream applications and jobs drop files (CSV, JSON, Parquet, LAS and others) into the landing storage, or hold the data in a database a flow reads.
    ref: osdu/docs/reference/guides/getting-started.md
  osdu:
    kind: external
    name: OSDU data platform
    tech: OSDU APIs
    icon: lucide:layers
    description: "The target partition: its core services and the domain data management services (DDMS) that hold records and bulk data."
    brief: Where the records land.
    detail: "A data partition's core services (Storage, Search, Schema, Legal, File, Dataset, Workflow, Entitlements) and its domain data management services (Wellbore, Reservoir over ETP, Production), which hold the delivered records and their bulk data."
    ref: osdu/docs/reference/concepts/protocols.md
  repo:
    kind: external
    name: Estate repository
    tech: GitHub
    icon: lucide:git-branch
    description: "The estate as files: flows, mappings, templates, schedules and AI contexts. What runs is the commit last synced."
    brief: The estate's documents.
    detail: "The estate as YAML and JSON files in git: flows, mappings, templates, cache definitions, schedules, assertions and AI contexts. A run executes the commit the control plane last synced, never a working copy."
    ref: osdu/docs/reference/flow/repository.md
  entra:
    kind: external
    name: Microsoft Entra ID
    icon: lucide:shield-check
    description: Signs people in through the app role SqlFlow.User, and issues the tokens the services reach Azure and OSDU with.
    brief: Signs people in.
    detail: "Signs people in to the GUI, the editor and the command line (OpenID Connect) through the app registration's one role, SqlFlow.User, with assignment required, and issues the managed identity and client-credential tokens (OAuth 2.0) the services use for Azure and OSDU."
    ref: osdu/docs/reference/concepts/authentication-and-identity.md
  ai_provider:
    kind: external
    name: AI model provider
    tech: Azure AI Foundry
    icon: azure:ai-foundry
    tags: [ai]
    description: "Answers the assistant's questions: gpt-5.1 on Azure AI Foundry by default, or OpenAI or Anthropic. No flow calls it."
    brief: Answers questions.
    detail: "The chat model behind the GUI assistant and Explain: a Foundry deployment (gpt-5.1 in the shipped environments), or OpenAI or Anthropic by setting, plus an optional transcription deployment for voice. Off on a fresh deployment; no flow, mapping, render or delivery ever calls a model."
    ref: osdu/docs/reference/concepts/ai-features.md
  ai_clients:
    kind: external
    name: AI coding assistants
    icon: lucide:bot
    tags: [ai]
    description: "Claude Code, the VS Code chat, Cursor or Codex: a person's own assistant, reading the estate with their sign-in."
    brief: A person's own assistant.
    detail: "An assistant a person runs (Claude Code, the VS Code chat, Cursor, Codex). It calls the MCP server with the person's own token, so it can do what that person can do, and what it does is recorded as theirs."
    ref: osdu/docs/reference/guides/mcp.md
  anthropic:
    kind: external
    name: Anthropic API
    tech: Messages API
    icon: lucide:sparkles
    tags: [ai]
    description: "Only with an Anthropic key: a question's synonyms, and questions for report visuals."
    brief: Only with a key.
    detail: "Always Anthropic, whatever the assistant's provider: synonym expansion of a ! question (find_similar_questions) and the questions a repository sync generates for report visuals. Both stay off without an Anthropic key."
    ref: osdu/docs/reference/concepts/ai-features.md
  slack:
    kind: external
    name: Slack assistant
    tech: SqlFlow.SlackBot
    icon: lucide:message-square
    tags: [ai]
    description: "SQLFlow's Slack bot, through the same MCP server; no template here deploys it."
    brief: Not deployed by default.
    detail: "SQLFlow's Slack bot (Socket Mode). It answers through the same gateways and MCP server, under the same fence as the GUI chat, and marks every answer as AI-generated. No template of this product deploys it."
    ref: osdu/docs/reference/concepts/ai-features.md
  github_actions:
    kind: external
    name: GitHub Actions
    tech: OIDC
    icon: lucide:workflow
    description: "The estate's workflow: after a merge, syncs the environment and fires its schedules."
    brief: Runs after a merge.
    detail: "A job proves who it is with the OpenID Connect token GitHub mints for it, for the audience the control plane names, and makes trigger requests: sync this repository at this commit, then fire these schedules. Nothing secret is stored."
    ref: sqlflow/docs/reference/concepts/external-triggers.md

  # ---------------------------------------------------------------------------------------------- containers ---
  gui:
    kind: container
    name: Workbench GUI
    tech: React on nginx
    shape: browser
    icon: lucide:layout-dashboard
    description: "Runs, lineage, the ledger, the explorer, the assistant."
    brief: The pages people work in.
    detail: "SQLFlow's workbench with the module's pages registered through the GUI module contract: pipelines and runs, lineage, the ledger and its records, the explorer of what OSDU holds, assertions, dimensions, inventories, templates, caches and the chat assistant. A static single-page app served by nginx; it calls the control plane's API."
    ref: osdu/docs/reference/concepts/gui.md
  vscode:
    kind: container
    name: VS Code extension
    tech: TypeScript
    icon: lucide:code-xml
    description: "GUI pages in the editor; checks and previews documents."
    brief: Pages and checks in the editor.
    detail: "Makes the editor the place a pipeline is developed: the GUI's pages in tabs, completion and checks for every flow, mapping and template, a mapping's preview from the open file, and one sign-in it shares with the command line and the MCP server."
    ref: osdu/docs/reference/guides/vscode.md
  cli:
    kind: container
    name: sqlflow CLI
    tech: .NET 9
    shape: terminal
    icon: lucide:square-terminal
    description: "SQLFlow's verbs and the OSDU verbs: check, preview, values."
    brief: Checks, previews, drives.
    detail: "The sqlflow command line (SqlFlow.Delivery.Cli.Host): every SQLFlow verb plus the OSDU verbs (check, preview, values, records, config, partition, cache, template and more). It checks and previews the working copy, drives the control plane, and can run a flow locally through the same executors a node uses."
    ref: osdu/docs/reference/cli/check.md
  mcp:
    kind: container
    name: MCP server
    tech: Rust
    icon: lucide:bot
    tags: [ai]
    description: "The assistant's rules and tools: metadata, docs, ! queries."
    brief: The assistant's tools.
    detail: "osdu-delivery-mcp, a Model Context Protocol server: SQLFlow's server composed with the delivery module. Every assistant reads its instructions; it answers from metadata, and from data only for a ! question through a read-only query over what an approved AI context opens. It holds no credential: it forwards each caller's token."
    ref: osdu/docs/reference/guides/mcp.md
    zoom: mcp-server
  cp:
    kind: container
    name: Control plane
    tech: ASP.NET Core
    icon: lucide:server
    description: "API, sign-in, sync, schedules, run queue, node protocol."
    brief: Decides what runs.
    detail: "SQLFlow's control plane (.NET 9) with DeliveryControlPlaneModule: the REST API (the delivery API under /api/v1/delivery), identity and tokens, the managed git sync, schedules, the run queue and dispatcher, the node protocol, the chat assistant, and the module's background services. It decides what runs and owns the state; it runs no flow itself."
    ref: osdu/docs/reference/concepts/control-plane.md
    zoom: control-plane
  node:
    kind: container
    name: Compute node
    tech: .NET 9 worker
    icon: lucide:cpu
    description: "Pulls runs; executes the file, ing and eight OSDU kinds."
    brief: Executes the flows.
    detail: "SqlFlow.Delivery.Worker.Host: SQLFlow's worker with the module installed. It takes its work outbound from the control plane, so it can sit next to the data, and reads and writes the ledger in the osdu schema through the catalog's connection."
    ref: osdu/docs/reference/cli/worker.md
    zoom: compute-node
  catalog:
    kind: container
    name: Catalog database
    tech: Azure SQL
    shape: cylinder
    icon: azure:sql-database
    description: "OsduDelivery: SQLFlow's catalog and the osdu schema."
    brief: The catalog and the ledger.
    detail: "OsduDelivery: SQLFlow's catalog (pipelines, runs, schedules, lineage, users, conversations) and, beside it, the osdu schema with its own migrations: the ledger, the audit trail, cache versions, the index of the repository's templates, partitions and the central configuration."
    ref: osdu/docs/reference/concepts/database.md
  data:
    kind: container
    name: Ingestion database
    tech: Azure SQL
    shape: cylinder
    icon: azure:sql-database
    description: "OsduData: pre tables, and the keyed tables to deliver."
    brief: Pre and keyed tables.
    detail: "OsduData: the pre tables a file flow lands its files into, the keyed ingestion tables an ing flow upserts (stamping UpdatedDate_DW) and a delivery flow reads incrementally, and the tables dimension flows build. Snapshot isolation must be on."
    ref: osdu/docs/reference/concepts/architecture.md
  landing:
    kind: container
    name: Landing storage
    tech: ADLS Gen2
    shape: folder
    icon: azure:storage-account
    description: "Source files, bulk files to send, work batches."
    brief: Source and bulk files.
    detail: "A storage account with a hierarchical namespace and shared keys off, container landing. Every run is given its location as LANDING_URL (abfss://landing@<account>.dfs.core.windows.net): the source files the file flows land, the bulk payload files deliveries send, and work batch files when a flow writes them there."
    ref: osdu/docs/reference/guides/deployment.md

  # ------------------------------------------------------------------------------- control plane components ---
  cp_api:
    kind: component
    name: REST API
    tech: ASP.NET Core minimal APIs
    icon: lucide:route
    description: "/api/v1 and /api/v1/delivery; every call signed in."
    detail: "SQLFlow's routes (pipelines, runs, schedules, lineage, repositories, users, chat) and the module's under /api/v1/delivery. Every call is authenticated: Entra single sign-on, local login, the device grant, personal access tokens, node tokens and an assistant run's delegated token. read, operate and author admit any signed-in user; admin checks the scope."
    ref: osdu/docs/reference/concepts/api.md
  cp_nodeproto:
    kind: component
    name: Node protocol
    tech: HTTPS polling
    icon: lucide:network
    description: "Nodes poll for runs and report; KEDA reads its target."
    detail: "/api/v1/node: a node with a node-scope token polls for work, fetches the flow version its run is pinned to, streams progress and posts results. /api/v1/node/scale-target answers KEDA with max(demand, the pool's floor, a manual setting) plus busy nodes, so a pool never shrinks under work."
    ref: sqlflow/docs/reference/cli/worker.md
  cp_sched:
    kind: component
    name: Scheduler
    tech: Hosted services
    icon: lucide:calendar-clock
    description: "Fires schedules, queues pinned runs, dispatches them."
    detail: "Fires the schedules the estate declares (in order within a schedule), queues runs each pinned to the commit last synced, splits a large delivery into parts on nodes of their own, and dispatches under a lease, which is why the control plane runs as one replica."
    ref: sqlflow/docs/reference/concepts/control-plane.md
  cp_sync:
    kind: component
    name: Repository sync
    tech: SQLFlow catalog sync
    icon: lucide:refresh-cw
    description: "Reads a commit, checks it, projects it into the catalog."
    detail: "The managed git sync: reads the commit a trigger names, the branch's tip on a person's request, or every interval when auto sync is on; validates every document; writes the catalog's rows and, through DeliveryCatalogSync, the module's mappings, cache definitions and interfaces; recomputes lineage. It only moves forward."
    ref: sqlflow/docs/reference/concepts/repository-auto-sync.md
  cp_direct:
    kind: component
    name: Direct operations
    tech: DeliveryOperations
    icon: lucide:eye
    description: "Previews, read-backs, the explorer, target probes."
    detail: "Run in the control plane's process while the request waits: a mapping's preview, a record read back from OSDU, its source rows, a scope's values, the explorer's reads of what OSDU holds, and a probe of a flow's target. A read writes no activity; a probe is recorded."
    ref: osdu/docs/reference/concepts/control-plane.md
  cp_ai:
    kind: component
    name: Assistant
    tech: SqlFlow.Assistant
    icon: lucide:sparkles
    tags: [ai]
    description: "Chat runs with a delegated token; guards ! queries."
    detail: "The assistant gateway and the AI context guard: runs each chat or Explain question under a token delegated for that run, with the MCP server as the model's tool, and opens to a ! question only the columns approved AI contexts name."
    ref: osdu/docs/reference/concepts/ai-features.md
    zoom: ai-usage
  cp_assist:
    kind: component
    name: Assistant gateway
    tech: SqlFlow.Assistant
    icon: lucide:sparkles
    tags: [ai]
    description: "Runs a question: delegated token, model, MCP as tool."
    detail: "Runs each chat or Explain question under a token delegated from the person for that run alone (its timeout plus 60 seconds, no admin or node scope), sends the model the MCP server's instructions and the conversation with the MCP server as its tool, streams the answer and keeps the conversation."
    ref: osdu/docs/reference/concepts/ai-features.md
  cp_aictx:
    kind: component
    name: AI context guard
    tech: ColumnPolicyGuard
    icon: lucide:shield
    tags: [ai]
    description: "Opens only approved columns; plans read-only queries."
    detail: "Holds the AI contexts an administrator approved and the saved answers. prepare_query and run_query: one read-only SELECT over the columns the approved contexts open, checked on prepare and on run, redeemed by a single-use plan token that lives 15 minutes, run on a node as a compute task."
    ref: osdu/docs/reference/guides/mcp.md
  cp_hosted:
    kind: component
    name: Hosted services
    tech: Start-up and background
    icon: lucide:history
    description: "Reconciles the configuration at start; caches, probes."
    detail: "At every start, one ordered, repeatable pass: catalog then osdu migrations, the initial admin, the node credential, repositories, partitions, run values and triggers (GET /api/v1/bootstrap). Then the module's services: cache rollout and warm-up, the scheduled target probe, the OSDU data definitions copy, duplicate-check sweeps, ledger moves of renamed flows."
    ref: osdu/docs/reference/concepts/control-plane.md

  # -------------------------------------------------------------------------------- compute node components ---
  n_runtime:
    kind: component
    name: Node runtime
    tech: SQLFlow worker
    icon: lucide:cpu
    description: "Polls, runs four at once, resolves references, drains."
    detail: "SQLFlow's worker verb with the module installed: polls the control plane with its node token, takes runs and node tasks into its slots (four by default), checks out the commit each run is pinned to, resolves ${env:...} and ${keyvault:...} references with its own identity, and drains running work before it stops."
    ref: osdu/docs/reference/cli/worker.md
  n_sqlflow:
    kind: component
    name: SQLFlow engine
    tech: SQLFlow flows
    icon: lucide:workflow
    description: "File flows land files; ing flows upsert keyed tables."
    detail: "SQLFlow's own flows, unchanged: a file flow lands the source files into a pre table as text with FileName_DW and RowNumber_DW and refreshes its typed view; an ing flow upserts the view into a keyed ingestion table and stamps UpdatedDate_DW on every row it changes."
    ref: osdu/docs/reference/concepts/overview.md
  n_exec:
    kind: component
    name: OSDU executors
    tech: SqlFlow.Delivery engine
    icon: lucide:boxes
    description: "The eight OSDU kinds; plans and drains deliveries."
    detail: "One executor per OSDU flow kind (delivery, retrieval, cache, assertion, dimension, inventory, removal, download) behind SQLFlow's DocumentExecutor. A delivery run plans into a submission and work batches, then drains them under leases; a large one fans out a part per 1,000 rows, on up to eight nodes."
    ref: osdu/docs/reference/flow/overview.md
  n_intake:
    kind: component
    name: Intake
    tech: SubmissionIntake
    icon: lucide:file-search
    description: "Reads changed rows; keeps what renders differently."
    detail: "Reads the rows of the ingestion table and its children whose UpdatedDate_DW moved since the last run (with a short overlap), has each one rendered, and compares its hash with what the ledger last delivered: unchanged records are skipped, changed ones planned into work batches."
    ref: osdu/docs/reference/concepts/change-detection.md
  n_render:
    kind: component
    name: Renderer
    tech: Mapping engine
    icon: lucide:file-json
    description: "Row to record: pinned mapping, template, cache."
    detail: "Renders a row through the mapping the flow pins (Name@version), against the template that mapping pins and the version of the partition's cache it reads from the catalog, and mints the record's id from the delivery key, so the same row always becomes the same record."
    ref: osdu/docs/reference/flow/mapping.md
  n_routes:
    kind: component
    name: Routes
    tech: HTTP and ETP clients
    icon: lucide:send
    description: "storage, file, manifest, ddms, workflow, etp, more."
    detail: "The protocol of each route: the storage service's batched writes, signed-URL file uploads, dataset registration, manifest ingestion through the workflow service, a DDMS's records and bulk data, workflow runs, the Production DDMS, and ETP 1.2 to the Reservoir DDMS. Legal tags are checked before a run; retries, rate limits and correlation ids on every call; OSDU tokens by client credentials."
    ref: osdu/docs/reference/flow/routes.md
  n_ledger:
    kind: component
    name: Ledger
    tech: SqlFlow.Delivery.Ledger
    icon: lucide:scroll-text
    description: "Submissions, records, attempts, activities, leases."
    detail: "The only path to the ledger: submissions, records with their source file and row, render context and OSDU id and version, one append-only attempt per try, the audit trail, leases that let nodes share a submission, and the minted ids an unfinished delivery is undone by."
    ref: osdu/docs/reference/concepts/ledger.md

  # ----------------------------------------------------------------------------------- MCP server components ---
  m_transport:
    kind: component
    name: Transports
    tech: stdio and streamable HTTP
    icon: lucide:plug
    description: "stdio for an editor; HTTP on /mcp with a bearer."
    detail: "stdio, started by the editor with the person's stored sign-in; or osdu-delivery-mcp http, streamable HTTP on /mcp, where every request carries Authorization: Bearer, checked with GET /api/v1/me before any tool runs. Over HTTP it holds no credential of its own."
    ref: osdu/docs/reference/guides/mcp.md
  m_instructions:
    kind: component
    name: Instructions
    tech: Rules and modes
    icon: lucide:book-marked
    description: "One set of rules; estate mode, or data mode after !data."
    detail: "The rules every client reads at initialize: what ! means, how follow-ups are answered, where a person acts. Estate mode holds the metadata tools; data mode, entered by !data or a bare !, holds only the semantic layer, stored questions and query tools; !exit returns. A session refuses the other mode's tools."
    ref: osdu/docs/reference/guides/mcp.md
  m_estate:
    kind: component
    name: Estate tools
    tech: delivery_* and SQLFlow tools
    icon: lucide:list-tree
    description: "30 delivery_* tools and SQLFlow's: metadata only."
    detail: "A record's custody state, OSDU id and version, attempts and errors, source file and row, who acted and when; flows, mappings, templates, caches, assertions, dimensions; counts and health. Never a record's content, a source row, cached values or a dimension's values. Seven SQLFlow tools that profile data are withheld."
    ref: osdu/docs/reference/guides/mcp.md
  m_data:
    kind: component
    name: Data tools
    tech: Semantic layer, queries
    icon: lucide:database-zap
    description: "Approved AI contexts, stored questions, query tools."
    detail: "get_semantic_layer and its search, find_similar_questions with the grounding to answer from, prepare_query (shown to the person), run_query with its plan token, auto_run_trusted_match for a saved answer a person confirmed, and confirm_question for a verdict."
    ref: osdu/docs/reference/guides/mcp.md
  m_docs:
    kind: component
    name: Docs index
    tech: Embedded manifest
    icon: lucide:library
    description: "This reference and the wiki, compiled in, searchable."
    detail: "build.rs embeds every page the manifest lists, OSDU Delivery's reference and wiki and SQLFlow's, so search_docs, get_doc and related_docs answer without the network; the key census teaches the flow language."
    ref: osdu/docs/reference/README.md

  # ------------------------------------------------------------------------------------- deployment: Azure ---
  acr:
    kind: infra
    name: Container registry
    tech: Azure Container Registry
    icon: azure:container-registry
    description: "The four images, tagged with the commit."
    detail: "Created by hand once per environment, read by the Terraform; every app pulls its image with AcrPull."
    ref: osdu/deploy/README.md
  vault:
    kind: infra
    name: Key Vault
    tech: RBAC
    icon: azure:key-vault
    description: "Every secret a ${keyvault:...} reference names."
    brief: Secrets by reference.
    detail: "osdu-kv-<suffix>, RBAC only. Terraform writes the connection strings (no credential in them); the setup script generates the JWT signing key, the first admin's password and the node token when missing; a person puts in each partition's client secret and the GitHub App's key."
    ref: osdu/deploy/README.md
  logs:
    kind: infra
    name: Log Analytics
    tech: osdu-delivery-logs
    icon: azure:log-analytics
    description: "The apps' logs, kept 30 days."
    ref: osdu/deploy/README.md
  identities:
    kind: infra
    name: Managed identities
    tech: User-assigned
    icon: azure:managed-identity
    description: "One per app and one for setup; no secrets for Azure."
    detail: "osdu-delivery-control-plane-id, -worker-id, -gui-id and -mcp-id, and osdu-delivery-setup, which no app runs as. Each app reaches SQL, the vault, the storage and the model keylessly with its own identity."
    ref: osdu/deploy/README.md
  scripts:
    kind: infra
    name: Setup scripts
    tech: Deployment scripts
    icon: azure:container-instances
    description: "Setup-Estate.ps1: missing secrets, database users."
    detail: "Two AzurePowerShell deployment scripts, run as the setup identity on every apply: one generates the secrets the vault lacks, the other creates the apps' database users and grants."
    ref: osdu/deploy/README.md
  foundry:
    kind: infra
    name: AI Foundry
    tech: AIServices S0

      - {n: 5, from: node, to: data, label: Reads the rows changed since the watermark, tech: SQL, width: 100, exit: [bottom, -60], entry: [top, 80], t: 0.75, explain: "The delivery flow's run reads the rows (and child rows) whose UpdatedDate_DW moved since its last run, under snapshot isolation."}
      - {n: 6, from: node, to: catalog, label: "Renders with the pinned mapping and cache; compares with the ledger", tech: SQL, width: 100, exit: [bottom, 70], entry: [top, -110], t: 0.25, explain: "Each row renders through the pinned mapping, its template and the partition's cache version read from the catalog; its hash is compared with what the ledger last delivered, and only what renders differently is planned."}
      - {n: 7, from: node, to: osdu, label: "Checks legal tags; sends the record and its bulk data", tech: "REST, ETP 1.2", width: 200, exit: [right, -25], entry: [left, -25], explain: "The route checks the legal tags, then sends the record (and its files or bulk data) to OSDU under its deterministic id, retrying what may succeed later."}
      - {n: 8, from: node, to: catalog, label: "Writes the attempt: OSDU id, version, outcome", tech: SQL, width: 100, exit: [bottom, 150], entry: [top, -30], t: 0.75, explain: "Every try is one append-only attempt in the ledger: the document hash it sent, what each step answered, the OSDU id and version, the outcome and any error."}
      - {n: 9, from: operator, to: gui, label: Follows the record to its source row, tech: HTTPS, width: 140, explain: "An operator finds the record by key, OSDU id or source file, and the ledger shows its source file and row, the mapping and cache version that rendered it, every attempt and every action taken."}
      - {n: 10, from: gui, to: cp, label: Reads the ledger, tech: JSON/HTTPS, width: 110, explain: "The GUI reads it through the delivery API; every count it shows is counted from the ledger's records."}
    notes: |
      Steps 2 to 8 are three runs of three flows (`-01-pre`, `-02-ing`, `-03-delivery`), each with its own log and failure,
      ordered by lineage. A delivery run plans into a submission and work batches, then drains them under leases; a large
      one fans out a part per 1,000 rows on up to eight nodes. `plan` stops after step 6; `verify` reads delivered records
      back and records `match`, `drifted` or `missing` ([submissions](../concepts/submissions.md)).


      - {n: 2, from: gui, to: cp_assist, label: Sends the question, tech: JSON/HTTPS, width: 100, shift: -45, t: 0.3, explain: "The control plane delegates a token from the person for this run alone: their id, no admin or node scope, refused on every route not opened to the assistant."}
      - {n: 3, from: cp_assist, to: ai_provider, label: "Question, history, the MCP server as tool with the run's token", tech: Responses API, width: 150, exit: [right, -30], entry: [bottom, -80], route: hv, explain: "The gateway sends the model the MCP server's instructions, the last 20 messages and the question, with the MCP server as its tool and the run's token in the tool's header."}
      - {n: 4, from: ai_provider, to: mcp, label: "find_similar_questions, prepare_query", tech: MCP over HTTPS, width: 150, explain: "The model calls the server's data-mode tools: stored questions close to this one, with the semantic layer to answer from, and prepare_query with the SQL it composed."}

# Pre-ingestion: LogCurveFamily reference values into the pre layer.
#
# The first flow of the chain welldb-ref-03-delivery reads for LogCurveFamily: the curve families the curve dictionary
# files the sample's curves under. It lands the CSV files under data/log-curve-family into [pre].[LogCurveFamily] as raw
# text and refreshes the typed view [pre].[v_LogCurveFamily] that welldb-ref-logcurvefamily-02-ing reads. The file holds
# OSDU's own values, as the OSDU data definitions publish them, written by osdu/tools/SampleData (--reference) from the
# reference value manifests. Every column is declared: a reference value is text the record carries as it stands,
# whatever a value looks like.
name: welldb-ref-logcurvefamily-01-pre
batch: welldb

source:
  type: csv
  location: data/log-curve-family
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"
    # OSDU's longest descriptions run to some thousand characters, past the parser's default of 1024 bytes.
    maxBufferSize: 65536

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: LogCurveFamily

schema:
  evolve: widen
  # Unicode raw columns wide enough for those descriptions: a raw column is varchar(255) otherwise.
  defaultColumnType: nvarchar(4000)

transform:
  inferTypes: false
  onConvertError: fail
  columns:
    - { name: code, type: "nvarchar(200)" }
    - { name: name, type: "nvarchar(400)" }
    - { name: description, type: "nvarchar(4000)" }
    - { name: attribution_authority, type: "nvarchar(200)" }
    - { name: attribution_publication, type: "nvarchar(400)" }
    - { name: attribution_revision, type: "nvarchar(100)" }
    - { name: source, type: "nvarchar(1000)" }
    - { name: commit_date, type: "varchar(40)" }
    - { name: unit_quantity, type: "nvarchar(200)" }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: welldb-reference
